{% extends "webpages/base.html" %}
{% block content %}
{% load crispy_forms_tags %}

<h2 class="mx-auto w-50">Login</h2>
{% for message in messages %}
    <div class="alert alert-danger" role="status">{{message}}</div>
{% endfor %}

<form method="POST" class="mx-auto w-50">
    {% csrf_token %}
    {{ form | crispy }}

    <input type="hidden" name="text" value="{{next}}">
    <button class="btn btn-primary" type="submit">Sign in</button>
</form>




{% endblock %}
